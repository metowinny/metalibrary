<h2>Первый подзаголовок</h2>

<p>Основной текст под подзаголовком. В публицистике пригодятся заголовки, цитаты и сноски.<sup>1</sup></p>

<blockquote><p>Цитата из чьих-то слов, чтобы было на что опереться.</p></blockquote>
