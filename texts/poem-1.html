<div class="epigraph">Строчка-эпиграф, заглушка
<span class="by">— Автор эпиграфа</span></div>

<p class="verse">Здесь будет первая строка стихотворения,
здесь — вторая, поживее,
а третья уйдёт в тишину.</p>

<p class="verse">Здесь начнётся вторая строфа.
Это заглушка, просто заглушка,
и пока этого достаточно.</p>

<hr>

<p class="signature">Заглушка, 2026</p>
